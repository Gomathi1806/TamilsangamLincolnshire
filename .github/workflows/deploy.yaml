name: Build and Deploy to IONOS

on:
  push:
    branches:
      - main  # Trigger deployment when you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Matches modern Node.js versions
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Deploy Files via Secure SFTP to IONOS
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server: ${{ secrets.FTP_SERVER }}
        port: 22
        local_path: './dist/*'      # Paths use underscores in this action
        remote_path: '/tamilSite'            # Uploads straight to your web root
        sftp_only: true
